spring:
  mongodb:
    uri: mongodb://localhost:27017/tracker
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    uris: http://localhost:9200
  session:
    timeout: 30m
    redis:
      namespace: tracker:session
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

clickhouse:
  url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/tracker}
  username: ${CLICKHOUSE_USERNAME:tracker}
  password: ${CLICKHOUSE_PASSWORD:tracker}

analytics:
  export:
    enabled: true
    delay-ms: 5000